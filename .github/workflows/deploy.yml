name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update -y || true; sudo apt-get install -y sshpass

      - name: Deploy to server
        env:
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          sshpass -e ssh -p "${{ secrets.DEPLOY_PORT || '22' }}" -o StrictHostKeyChecking=no "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" << 'EOF'
            set -e
            echo "--- whoami ---"; whoami; id
            echo "--- ownership ---"; ls -la "${{ secrets.DEPLOY_PATH }}" | head -5
            ls -la "${{ secrets.DEPLOY_PATH }}/.git" | head -10
            git config --global --add safe.directory ${{ secrets.DEPLOY_PATH }}
            git -C "${{ secrets.DEPLOY_PATH }}" pull origin master
            docker compose -f "${{ secrets.DEPLOY_PATH }}/docker-compose.yml" up -d --no-deps --build web
          EOF
